name: PHOBOS-ML CI

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Install build tools
        run: sudo apt-get install -y build-essential

      # ============================
      # LINT (runs on all branches)
      # ============================
      - name: Check formatting
        run: |
          clang-format-18 -style=file:.clang-format --dry-run --Werror \
            src/*.c include/*.h tests/*.c

      # ============================
      # COVERAGE FLAGS (qa only)
      # ============================
      - name: Debug coverage env
        if: github.ref == 'refs/heads/qa'
        run: echo "CFLAGS=$CFLAGS LDFLAGS=$LDFLAGS"

      - name: Enable coverage flags (QA only)
        if: github.ref == 'refs/heads/qa'
        run: |
          echo "CFLAGS=--coverage" >> $GITHUB_ENV
          echo "LDFLAGS=--coverage" >> $GITHUB_ENV

      - name: Clean build (QA only)
        if: github.ref == 'refs/heads/qa'
        run: make clean || true

      # ============================
      # BUILD (runs on all branches)
      # ============================
      - name: Build project
        run: make

      # ============================
      # TESTS (runs on all branches)
      # ============================
      - name: Build all tests
        run: |
          for t in tests/test_*.c; do
            name=$(basename "$t" .c)
            make "build/$name"
          done

      - name: Run all tests
        run: |
          set -e
          for t in build/test_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            echo "Running $t"
            "$t"
          done

      # ============================
      # VALGRIND (dev + qa only)
      # ============================
      - name: Install valgrind
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/qa'
        run: sudo apt-get install -y valgrind

      - name: Memory check (all tests)
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/qa'
        run: |
          for t in build/test_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            echo "Valgrind $t"
            valgrind --leak-check=full "$t"
          done

      # ============================
      # COVERAGE (qa only)
      # ============================
      - name: Install gcov/lcov
        if: github.ref == 'refs/heads/qa'
        run: sudo apt-get install -y lcov

      - name: Coverage
        if: github.ref == 'refs/heads/qa'
        run: |
          lcov --capture --directory . --output-file coverage.info --ignore-errors empty
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors empty
          lcov --list coverage.info

      # ============================
      # RELEASE (main only)
      # ============================
      - name: Prepare release artifact
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp build/phobosml release/
