name: PHOBOS-ML CI

on:
  push:
    branches:
      - dev
      - qa
      - main
      - feature/**
      - fix/**
  pull_request:
    branches:
      - dev
      - qa
      - main
      - feature/**
      - fix/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Install build tools
        run: sudo apt-get install -y build-essential

      # ============================
      # LINT
      # ============================
      - name: Check formatting
        run: |
          clang-format-18 -style=file:.clang-format --dry-run --Werror \
            src/*.c include/*.h tests/*.c

      # ============================
      # STATIC LIB
      # ============================
      - name: Build static library
        run: make lib

      # ============================
      # SHARED LIB
      # ============================
      - name: Build shared library
        run: make shared

      # ============================
      # COVERAGE FLAGS (qa only)
      # ============================
      - name: Enable coverage flags (QA only)
        if: github.ref == 'refs/heads/qa'
        run: |
          echo "CFLAGS=--coverage" >> $GITHUB_ENV
          echo "LDFLAGS=--coverage" >> $GITHUB_ENV

      - name: Clean build (QA only)
        if: github.ref == 'refs/heads/qa'
        run: make clean || true

      # ============================
      # BUILD
      # ============================
      - name: Build project
        run: make

      # ============================
      # TESTS
      # ============================
      - name: Build all tests
        run: |
          for t in tests/test_*.c; do
            name=$(basename "$t" .c)
            make "build/$name"
          done

      - name: Run all tests
        run: |
          set -e
          for t in build/test_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            echo "Running $t"
            "$t"
          done

      # ============================
      # VALGRIND (dev + qa only)
      # ============================
      - name: Install valgrind
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/qa'
        run: sudo apt-get install -y valgrind

      - name: Memory check (all tests)
        if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/qa'
        run: |
          for t in build/test_*; do
            [ -f "$t" ] && [ -x "$t" ] || continue
            echo "Valgrind $t"
            valgrind --leak-check=full "$t"
          done

      # ============================
      # COVERAGE (qa only)
      # ============================
      - name: Install gcov/lcov
        if: github.ref == 'refs/heads/qa'
        run: sudo apt-get install -y lcov

      - name: Coverage
        if: github.ref == 'refs/heads/qa'
        run: |
          lcov --capture --directory . --output-file coverage.info --ignore-errors empty
          lcov --remove coverage.info '/usr/*' --output-file coverage.info --ignore-errors empty
          lcov --list coverage.info

      # ============================
      # RELEASE (main only)
      # ============================
      - name: Prepare release artifact
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          cp build/phobosml release/

  # ───────────────────────────────────────────────
  # AUTO-TAGGING — PATCH or MINOR based on PR label
  # ───────────────────────────────────────────────
  auto-tag:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        startsWith(github.ref, 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Determine tag type
        id: tagtype
        run: |
          if echo "${{ github.event.pull_request.labels }}" | grep -q "release:minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Compute next version
        id: version
        run: |
          CURRENT=$(git describe --tags --abbrev=0)
          BASE=${CURRENT#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

          if [ "${{ steps.tagtype.outputs.type }}" = "minor" ]; then
            MINOR=$((MINOR+1))
            PATCH=0
          else
            PATCH=$((PATCH+1))
          fi

          echo "next=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"
